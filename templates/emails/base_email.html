<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Hub</title>
    <!--[if mso]>
    <style type="text/css">
        table { border-collapse: collapse; }
        body, table, td, p, a, h1, h2, h3 { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <style type="text/css">
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; min-width: 100%; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #1e293b; }

        .email-container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .header {
            background: linear-gradient(135deg, #0284c7 0%, #1e3a8a 100%);
            padding: 32px 28px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            margin: 0 0 6px 0;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header p {
            color: #bae6fd;
            margin: 0;
            font-size: 13px;
            font-weight: 500;
        }

        .content {
            padding: 36px 30px 28px 30px;
            background-color: #ffffff;
        }

        .button {
            display: inline-block;
            padding: 12px 26px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff !important;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            margin-top: 10px;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
        }

        .button:hover {
            background: #0369a1;
        }

        .footer {
            background-color: #f8fafc;
            padding: 24px 30px;
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
            line-height: 1.6;
        }

        @media only screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
                border-radius: 12px !important;
            }
            .content {
                padding: 24px 20px !important;
            }
            .header {
                padding: 24px 18px !important;
            }
        }
    </style>
</head>

<body>
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f1f5f9; padding: 24px 12px 36px 12px;">
        <tr>
            <td align="center">
                <div class="email-container">
                    <div class="header">
                        <div style="display: inline-block; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 14px; padding: 10px 14px; margin-bottom: 12px;">
                            <span style="font-size: 26px; line-height: 1;">🎓</span>
                        </div>
                        <h1>ALUMNI HUB</h1>
                        <p>Official University Community &amp; Career Network</p>
                    </div>

                    <div class="content">
                        {% block content %}{% endblock %}
                    </div>

                    <div class="footer">
                        <p style="margin: 0 0 6px 0; color: #475569; font-weight: 600; font-size: 13px;">
                            Alumni Hub • JIMS Rohini Sector-5 Campus
                        </p>
                        <p style="margin: 0 0 10px 0;">
                            &copy; {{ year or 2026 }} Alumni Hub. All rights reserved.
                        </p>
                        <p style="margin: 0; font-size: 11px;">
                            Building Connections, Creating Opportunities
                        </p>
                    </div>
                </div>
            </td>
        </tr>
    </table>
</body>
</html>
